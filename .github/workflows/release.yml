name: Release

# 推送 v* tag 时自动构建 api/web 镜像:
#   1. 多架构镜像推送到 GHCR(ghcr.io/<owner>/remote-android/{api,web}:<tag>)
#   2. amd64 离线镜像包 + 现成 compose 文件上传 GitHub Release,供直接下载 docker load
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: 创建 Release 占位
    runs-on: ubuntu-latest
    steps:
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true

  build:
    name: 构建 ${{ matrix.name }} 镜像
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "api", context: "./server", image: "api" }
          - { name: "web", context: "./web", image: "web" }
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU(跨架构构建)
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 构建并推送多架构镜像(amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: 构建 amd64 单架构镜像(供导出离线包)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ github.ref_name }}

      - name: 导出镜像离线包
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ github.ref_name }}"
          OUT="remote-android-${{ matrix.image }}-${{ github.ref_name }}-amd64.tar.gz"
          docker save "$IMG" | gzip > "$OUT"
          echo "已导出 $OUT ($(du -h "$OUT" | cut -f1))"

      - name: 生成 Release 专用 compose 文件(api)
        if: matrix.image == 'api'
        run: |
          set -euo pipefail
          sed -e "s|build: ./server|image: ${{ env.REGISTRY }}/${{ github.repository }}/api:${{ github.ref_name }}|" \
              -e "s|build: ./web|image: ${{ env.REGISTRY }}/${{ github.repository }}/web:${{ github.ref_name }}|" \
              docker-compose.yml > docker-compose.release.yml
          grep -n "image:" docker-compose.release.yml

      - name: 上传镜像离线包到 Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: remote-android-${{ matrix.image }}-${{ github.ref_name }}-amd64.tar.gz

      - name: 上传 compose 文件到 Release(仅 api 任务)
        if: matrix.image == 'api'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: docker-compose.release.yml
