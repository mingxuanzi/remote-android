# RemoteAndroid web 主配置
# 对外只暴露 8443 一个端口:stream 层 ssl_preread 嗅探,
#   TLS 握手 → 127.0.0.1:8444(HTTPS server)
#   明文 HTTP → 127.0.0.1:8080(HTTP server)
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    map $ssl_preread_protocol $upstream_backend {
        ""      http_plain;   # 无 TLS → 明文 HTTP
        default http_tls;     # 有 TLS → HTTPS
    }

    upstream http_plain { server 127.0.0.1:8080; }
    upstream http_tls   { server 127.0.0.1:8444; }

    server {
        listen 8443;
        ssl_preread on;
        proxy_pass $upstream_backend;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 512m;

    # 明文 HTTP(仅容器内,由 stream 分流过来)
    server {
        listen 127.0.0.1:8080;
        server_name _;
        include /etc/nginx/app-locations.conf;
    }

    # HTTPS(自签证书,容器启动时自动生成;同样仅容器内)
    server {
        listen 127.0.0.1:8444 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        include /etc/nginx/app-locations.conf;
    }
}
