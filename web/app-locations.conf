# 共享的站点 location 配置(HTTP 与 HTTPS 两个 server 复用)
root /usr/share/nginx/html;
index index.html;

# index.html 不缓存(每次发版 hash 都会变,缓存旧 HTML 会一直跑旧 JS)
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri /index.html;
}

# 带 hash 的静态产物可以永久缓存
location /assets/ {
    expires 365d;
    add_header Cache-Control "public, immutable" always;
}

location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}

location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
    client_max_body_size 512m;   # APK 上传
}

location /ws/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# WebRTC WHEP 协商端点(MediaMTX 形态:/<path>/whep 及 /<path>/whep/<secret>)
location ~ ^/[^/]+/whep(/|$) {
    proxy_pass http://mediamtx:8889;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
}
